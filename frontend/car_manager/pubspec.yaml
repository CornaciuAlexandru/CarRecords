name: car_manager
description: CarRecords - Aplicatie pentru gestionarea documentelor si datelor auto
publish_to: 'none'
version: 1.0.19+1019

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # HTTP & networking
  dio: ^5.4.3+1

  # Local storage
  shared_preferences: '>=2.2.3 <2.3.0'

  # Verificare integritate update (SHA-256)
  crypto: ^3.0.3

  # Reclame (doar Android/iOS — pe Windows pachetul nu are implementare)
  google_mobile_ads: ^5.2.0

  # Camera & OCR
  image_picker: ^1.1.2

  # UI components
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  intl: ^0.20.0
  gap: ^3.0.1
  badges: ^3.1.2

  # File handling
  path_provider: ^2.1.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.18.0

# Forteaza versiuni fara Dart Native Assets / JNI (libdatastore_shared_counter.so,
# libdartjni.so) care cauzeaza crash la pornire pe Android
dependency_overrides:
  shared_preferences_android: '>=2.2.0 <2.3.0'
  path_provider_android: '>=2.2.0 <2.3.0'

flutter:
  uses-material-design: true
  # Genereaza clasa AppLocalizations din fisierele .arb (vezi l10n.yaml)
  generate: true
  assets:
    - assets/images/
    - assets/animations/

# ── Pachet MSIX pentru Microsoft Store ──────────────────────────
# Construire:  flutter build windows --release && dart run msix:create
#
# Valorile publisher/identity de mai jos sunt provizorii. Inainte de
# publicare, inlocuieste-le cu cele din Partner Center (Product identity):
#   msix_version         ramane sincronizat cu versiunea aplicatiei
#   identity_name        ex. 12345Nume.CarRecords
#   publisher            ex. CN=XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
#   publisher_display_name  numele contului de dezvoltator
# Vezi docs/microsoft-store.md pentru pasii completi.
msix_config:
  display_name: CarRecords
  publisher_display_name: CarRecords
  identity_name: CarRecords.CarRecords
  publisher: CN=CarRecords
  msix_version: 1.0.19.0
  logo_path: assets/images/logo_192.png
  capabilities: internetClient
  # Store-ul gestioneaza actualizarile — auto-updater-ul propriu se
  # dezactiveaza in pachetul MSIX (vezi AppConfig.selfUpdateEnabled).
  store: true
  architecture: x64
