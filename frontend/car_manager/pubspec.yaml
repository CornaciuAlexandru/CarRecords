name: car_manager
description: CarRecords - Aplicatie pentru gestionarea documentelor si datelor auto
publish_to: 'none'
version: 1.0.13+1013

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # HTTP & networking
  dio: ^5.4.3+1

  # Local storage
  shared_preferences: '>=2.2.3 <2.3.0'

  # Verificare integritate update (SHA-256)
  crypto: ^3.0.3

  # Camera & OCR
  image_picker: ^1.1.2

  # UI components
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  intl: ^0.20.0
  gap: ^3.0.1
  badges: ^3.1.2

  # File handling
  path_provider: ^2.1.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Forteaza versiuni fara Dart Native Assets / JNI (libdatastore_shared_counter.so,
# libdartjni.so) care cauzeaza crash la pornire pe Android
dependency_overrides:
  shared_preferences_android: '>=2.2.0 <2.3.0'
  path_provider_android: '>=2.2.0 <2.3.0'

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
