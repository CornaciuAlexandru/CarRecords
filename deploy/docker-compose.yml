# Stiva CarRecords pentru un server in cloud.
#
#   backend  — API-ul FastAPI
#   db       — PostgreSQL
#
# HTTPS-ul nu e aici. Pe un server cu mai multe aplicatii, fiecare cu propriul
# Caddy, doar prima apuca porturile 80 si 443. Terminarea TLS s-a mutat intr-o
# stiva separata, comuna intregii masini: vezi deploy/proxy/. Backend-ul se
# conecteaza la reteaua "web", de unde proxy-ul il gaseste dupa numele
# serviciului.
#
# Pornire:
#   docker network create web        # o singura data, pe server
#   docker compose --env-file .env up -d --build
#   cd proxy && docker compose --env-file .env up -d
#
# Valorile sensibile se citesc din fisierul .env de langa acest fisier.

# Numele proiectului, explicit. Fara el, Compose il deduce din numele
# folderului - iar folderul se cheama "deploy" si in celelalte proiecte de pe
# masina. Doua stive cu acelasi nume de proiect isi vad containerele una
# alteia ca resturi, si un `up --remove-orphans` in una le sterge pe ale
# celeilalte. S-a si intamplat.
name: carrecords

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DISCOVERY_ENABLED: "false"
      # Emailuri: resetarea parolei si confirmarea adresei.
      # Fara SMTP_HOST, mesajele ajung doar in jurnalul containerului.
      PUBLIC_URL: "${PUBLIC_URL:-https://api.${DOMAIN}}"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-CarRecords <noreply@carrecords.ro>}"
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
    volumes:
      - uploads:/app/uploads
      # Cheia contului de serviciu Google, cu care serverul verifica chitantele.
      # Calea din stanga se da in .env; fara ea, montarea nu se face si
      # cumpararile raspund 503 - ceea ce e corect: mai bine refuzam decat sa
      # acordam un abonament pe care nu l-am verificat.
      - ${GOOGLE_PLAY_KEY_HOST_PATH:-/dev/null}:/run/secrets/google-play.json:ro
    expose:
      - "8000"
    networks:
      # "default" ramane pentru vorbit cu baza de date, care nu are ce cauta
      # pe reteaua comuna.
      - default
      - web

networks:
  web:
    external: true

volumes:
  db_data:
  uploads:
